services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 20

  # Application-сервери: 2 репліки одразу, автоскейлер додає до MAX_SERVERS
  app:
    build: ./backend
    image: lab-app:latest
    environment: &appenv
      DATABASE_URL: postgresql://app:app@db:5432/app
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      SERVER_CAPACITY: 2          # задач одночасно на один сервер
      MAX_TASK_SECONDS: 120
      MAX_ACTIVE_PER_USER: 3
      MAX_HISTORY_PER_USER: 20
      MAX_QUEUE_LENGTH: 50
      ADMIN_USER: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    depends_on:
      db: {condition: service_healthy}
    deploy:
      replicas: 2

  # Load balancer + HTTPS termination
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on: [app]

  autoscaler:
    build: ./autoscaler
    environment:
      <<: *appenv
      APP_IMAGE: lab-app:latest
      NETWORK: lab-net
      MAX_SERVERS: 5
      SCALE_UP_AFTER: 5
      SCALE_DOWN_AFTER: 45
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db: {condition: service_healthy}
      app: {condition: service_started}

volumes:
  pgdata:

networks:
  default:
    name: lab-net
