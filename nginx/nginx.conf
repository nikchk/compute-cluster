worker_processes auto;
events { worker_connections 1024; }

http {
    # Вбудований DNS Docker: ім'я "app" повертає IP-адреси ВСІХ контейнерів app-серверів
    # (і тих, що стартував автоскейлер - вони мають alias "app"). nginx перевизначає
    # адреси кожні 3 с і розподіляє запити між ними по колу (round-robin) - це і є load balancer.
    resolver 127.0.0.11 valid=3s ipv6=off;

    log_format lb '$remote_addr [$time_local] "$request" $status -> $upstream_addr ($upstream_response_time s)';
    access_log /var/log/nginx/access.log lb;

    server {
        listen 80;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1m;

        location / {
            set $backend http://app:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # відмовостійкість: якщо сервер не відповідає - пробуємо наступний
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_read_timeout 30s;
        }
    }
}
